spring.application.name=CategoryManagementJPA

# Windows Authentication: do not configure SQL username/password.
spring.datasource.url=jdbc:sqlserver://MSI;instanceName=MSSQLSERVER01;databaseName=CategoryJPA_DB;encrypt=true;trustServerCertificate=true;integratedSecurity=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# The database schema must already exist and match the JPA entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=INFO

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload.dir=uploads/categories
app.security.remember-me-key=${REMEMBER_ME_KEY:local-dev-remember-me-key-change-before-deploy}

server.port=8080
