spring.application.name=CategoryManagementJPA

# Windows Authentication: do not configure SQL username/password.
spring.datasource.url=jdbc:sqlserver://MSI;instanceName=MSSQLSERVER01;databaseName=CategoryJPA_DB;encrypt=true;trustServerCertificate=true;integratedSecurity=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# The database schema must already exist and match the JPA entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=INFO

spring.servlet.multipart.max-file-size=${APP_MAX_VIDEO_FILE_SIZE:200MB}
spring.servlet.multipart.max-request-size=${APP_MAX_REQUEST_SIZE:205MB}
app.upload.dir=uploads/categories
app.video.upload-dir=${VIDEO_UPLOAD_DIR:uploads/videos}
app.video.max-file-size-bytes=${APP_MAX_VIDEO_FILE_SIZE_BYTES:209715200}
app.security.remember-me-key=${REMEMBER_ME_KEY:local-dev-remember-me-key-change-before-deploy}

# Configure these environment variables to enable email OTP.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
app.mail.from=${MAIL_FROM:}

server.port=8080
