<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Thanh toán | CategoryHub</title><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body class="shop-page"><div th:replace="~{fragments/shop-header :: header}"></div><main class="container shop-content">
    <div class="section-heading mb-4"><div><p class="eyebrow mb-1">SECURE CHECKOUT</p><h1>Xác nhận đơn hàng</h1></div></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <div class="row g-4"><div class="col-lg-7"><section class="panel"><h2 class="h5 mb-3">Thông tin giao hàng</h2>
        <form method="post"
              th:action="${buyNow} ? @{/checkout/buy/{productId}/place(productId=${buyNowProductId})} : @{/checkout}"
              th:object="${form}" class="needs-validation" novalidate>
            <input th:if="${buyNow}" type="hidden" name="quantity" th:value="${buyNowQuantity}">
            <div class="mb-3"><label class="form-label" for="recipientName">Tên người nhận</label><input id="recipientName" class="form-control" th:field="*{recipientName}" minlength="1" maxlength="100" required th:classappend="${#fields.hasErrors('recipientName')} ? 'is-invalid'"><div class="invalid-feedback" th:errors="*{recipientName}"></div></div>
            <div class="mb-3"><label class="form-label" for="phone">Số điện thoại</label><input id="phone" class="form-control" th:field="*{phone}" minlength="8" maxlength="20" pattern="[0-9+() .-]+" required th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'"><div class="invalid-feedback" th:errors="*{phone}"></div></div>
            <div class="mb-3"><label class="form-label" for="shippingAddress">Địa chỉ nhận hàng</label><textarea id="shippingAddress" class="form-control" rows="3" maxlength="500" th:field="*{shippingAddress}" required th:classappend="${#fields.hasErrors('shippingAddress')} ? 'is-invalid'"></textarea><div class="invalid-feedback" th:errors="*{shippingAddress}"></div></div>
            <div class="mb-3"><label class="form-label" for="note">Ghi chú</label><textarea id="note" class="form-control" rows="2" maxlength="1000" th:field="*{note}"></textarea></div>
            <fieldset class="mb-4"><legend class="form-label">Phương thức thanh toán</legend>
                <div class="form-check"><input class="form-check-input" type="radio" th:field="*{paymentMethod}" value="COD" id="cod"><label class="form-check-label" for="cod">Thanh toán khi nhận hàng (COD)</label></div>
                <div class="form-check"><input class="form-check-input" type="radio" th:field="*{paymentMethod}" value="DEMO" id="demo"><label class="form-check-label" for="demo">Thanh toán mô phỏng (không thu tiền thật)</label></div>
                <div class="field-error" th:errors="*{paymentMethod}"></div>
            </fieldset>
            <button class="btn btn-primary btn-lg w-100">Đặt hàng</button>
        </form>
    </section></div>
    <div class="col-lg-5"><section class="panel"><h2 class="h5">Đơn hàng của bạn</h2><div class="checkout-line" th:each="item : ${cart.items}"><span th:text="|${item.product.productName} × ${item.quantity}|"></span><strong th:text="${#numbers.formatDecimal(item.subtotal, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></strong></div><hr><div class="d-flex justify-content-between fs-5 fw-bold"><span>Tổng cộng</span><span class="product-price" th:text="${#numbers.formatDecimal(cart.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></span></div><p class="small text-secondary mt-3 mb-0">Hệ thống sẽ kiểm tra lại giá và tồn kho từ cơ sở dữ liệu khi đặt hàng.</p></section></div></div>
</main><div th:replace="~{fragments/shop-footer :: footer}"></div></body></html>
