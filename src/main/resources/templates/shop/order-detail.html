<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chi tiết đơn hàng</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body class="shop-page"><div th:replace="~{fragments/shop-header :: header}"></div><main class="container shop-content">
    <div class="section-heading mb-4"><div><p class="eyebrow mb-1">ORDER DETAIL</p><h1 th:text="|Đơn hàng #${order.orderId}|"></h1></div><span class="badge text-bg-primary" th:text="${order.orderStatus}"></span></div>
    <div class="row g-4"><div class="col-lg-8"><section class="panel p-0 overflow-hidden"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Sản phẩm</th><th>Đơn giá</th><th>Số lượng</th><th>Tạm tính</th></tr></thead><tbody><tr th:each="item : ${order.items}"><td><div class="d-flex align-items-center gap-2"><img class="cart-product-image" th:src="${item.productImage != null ? item.productImage : '/images/avatar.png'}" onerror="this.onerror=null;this.src='/images/avatar.png'" alt=""><span th:text="${item.productName}"></span></div></td><td th:text="${#numbers.formatDecimal(item.unitPrice, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></td><td th:text="${item.quantity}"></td><td th:text="${#numbers.formatDecimal(item.subtotal, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></td></tr></tbody></table></div></section></div>
        <div class="col-lg-4"><section class="panel"><h2 class="h5">Giao hàng</h2><p class="mb-1" th:text="${order.recipientName}"></p><p class="mb-1" th:text="${order.phone}"></p><p th:text="${order.shippingAddress}"></p><hr><p><strong>Thanh toán:</strong> <span th:text="${order.paymentMethod == 'COD' ? 'COD' : 'Demo - chưa thu tiền thật'}"></span></p><p><strong>Trạng thái:</strong> <span th:text="${order.paymentStatus}"></span></p><div class="d-flex justify-content-between fs-5"><strong>Tổng</strong><strong class="product-price" th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></strong></div><form th:if="${order.orderStatus == 'PENDING'}" class="mt-3" method="post" th:action="@{/member/orders/{id}/cancel(id=${order.orderId})}" onsubmit="return confirm('Bạn muốn hủy đơn hàng?')"><button class="btn btn-outline-danger w-100">Hủy đơn hàng</button></form></section></div></div>
    <a class="btn btn-light mt-3" th:href="@{/member/orders}">Quay lại đơn hàng</a>
</main><div th:replace="~{fragments/shop-footer :: footer}"></div></body></html>
