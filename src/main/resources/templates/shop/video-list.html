<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${pageTitle} + ' | CategoryHub'"></title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body class="shop-page"><div th:replace="~{fragments/shop-header :: header}"></div><main class="container shop-content">
    <div class="section-heading mb-4"><div><p class="eyebrow mb-1">THƯ VIỆN</p><h1 th:text="${pageTitle}"></h1></div><span class="text-secondary" th:text="|${videos.totalElements} video|"></span></div>
    <section class="panel mb-4"><form class="row g-2 align-items-end" method="get" th:action="@{/videos}">
        <div class="col-md-10"><label class="form-label">Danh mục</label><select class="form-select" name="categoryId"><option value="">Tất cả video</option><option th:each="category : ${categories}" th:value="${category.cateId}" th:text="${category.cateName}" th:selected="${selectedCategoryId == category.cateId}"></option></select></div>
        <div class="col-md-2 d-grid"><button class="btn btn-primary">Lọc</button></div>
    </form></section>
    <div class="row g-3">
        <div class="col-6 col-lg-3" th:each="video : ${videos.content}"><article class="product-card h-100">
            <a th:href="@{/videos/detail(id=${video.videoId})}"><div class="product-image-wrap"><img class="product-image" th:src="${video.poster != null ? video.poster : '/images/avatar.png'}" onerror="this.onerror=null;this.src='/images/avatar.png'" alt="Poster video"></div></a>
            <div class="p-3"><a class="product-category" th:if="${video.category != null}" th:href="@{/videos(categoryId=${video.category.cateId})}" th:text="${video.category.cateName}"></a><span class="product-category" th:unless="${video.category != null}">Chưa phân loại</span><a class="product-name" th:href="@{/videos/detail(id=${video.videoId})}" th:text="${video.title}"></a><small class="text-secondary" th:text="|${video.views != null ? video.views : 0} lượt xem|"></small></div>
        </article></div>
        <div class="col-12" th:if="${videos.empty}"><div class="empty-state">Chưa có video đang hiển thị trong danh mục này.</div></div>
    </div>
    <nav class="mt-4" th:if="${videos.totalPages > 1}"><ul class="pagination justify-content-center"><li class="page-item" th:each="n : ${#numbers.sequence(0, videos.totalPages - 1)}" th:classappend="${n == videos.number} ? 'active'"><a class="page-link" th:href="@{/videos(page=${n},categoryId=${selectedCategoryId})}" th:text="${n + 1}"></a></li></ul></nav>
</main><div th:replace="~{fragments/shop-footer :: footer}"></div></body></html>
