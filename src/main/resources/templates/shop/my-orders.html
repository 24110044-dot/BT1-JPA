<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Đơn hàng của tôi</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body class="shop-page"><div th:replace="~{fragments/shop-header :: header}"></div><main class="container shop-content"><div class="section-heading mb-4"><div><p class="eyebrow mb-1">ORDER HISTORY</p><h1>Đơn hàng của tôi</h1></div></div>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <section class="panel p-0 overflow-hidden"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Mã đơn</th><th>Ngày đặt</th><th>Tổng tiền</th><th>Thanh toán</th><th>Trạng thái</th><th></th></tr></thead><tbody>
        <tr th:each="order : ${orders.content}"><td th:text="|#${order.orderId}|"></td><td th:text="${#temporals.format(order.orderDate, 'dd/MM/yyyy HH:mm')}"></td><td th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></td><td th:text="${order.paymentMethod == 'COD' ? 'COD' : 'Demo (chưa thu tiền)'}"></td><td><span class="badge text-bg-light" th:text="${order.orderStatus}"></span></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{/member/orders/{id}(id=${order.orderId})}">Chi tiết</a></td></tr>
        <tr th:if="${orders.empty}"><td colspan="6" class="text-center py-5 text-secondary">Bạn chưa có đơn hàng.</td></tr>
    </tbody></table></div></section>
    <nav th:if="${orders.totalPages > 1}" class="mt-3"><ul class="pagination justify-content-center"><li class="page-item" th:each="n : ${#numbers.sequence(0, orders.totalPages - 1)}" th:classappend="${n == orders.number} ? 'active'"><a class="page-link" th:href="@{/member/orders(page=${n})}" th:text="${n + 1}"></a></li></ul></nav>
</main><div th:replace="~{fragments/shop-footer :: footer}"></div></body></html>
