<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${pageTitle} + ' | CategoryHub'"></title><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body class="shop-page"><div th:replace="~{fragments/shop-header :: header}"></div><main class="container shop-content">
    <div class="section-heading mb-4"><div><p class="eyebrow mb-1">CỬA HÀNG</p><h1 th:text="${pageTitle}"></h1></div><span class="text-secondary" th:text="|${products.totalElements} sản phẩm|"></span></div>
    <section class="panel mb-4"><form class="row g-2 align-items-end" method="get">
        <input th:if="${selectedCategoryId != null}" type="hidden" name="categoryId" th:value="${selectedCategoryId}">
        <div class="col-md-6"><label class="form-label">Tìm sản phẩm</label><input class="form-control" name="keyword" th:value="${keyword}" placeholder="Tên sản phẩm..."></div>
        <div class="col-md-4"><label class="form-label">Sắp xếp</label><select class="form-select" name="sort"><option value="newest" th:selected="${sort == 'newest'}">Mới nhất</option><option value="priceAsc" th:selected="${sort == 'priceAsc'}">Giá tăng dần</option><option value="priceDesc" th:selected="${sort == 'priceDesc'}">Giá giảm dần</option></select></div>
        <div class="col-md-2 d-grid"><button class="btn btn-primary">Áp dụng</button></div>
    </form></section>
    <div class="row g-3">
        <div class="col-6 col-lg-3" th:each="product : ${products.content}"><article class="product-card h-100">
            <a th:href="@{/products/detail/{id}(id=${product.productId})}"><div class="product-image-wrap"><img class="product-image" th:src="${product.image != null ? product.image : '/images/avatar.png'}" onerror="this.onerror=null;this.src='/images/avatar.png'" alt="Sản phẩm"></div></a>
            <div class="p-3"><span class="product-category" th:text="${product.category.cateName}"></span><a class="product-name" th:href="@{/products/detail/{id}(id=${product.productId})}" th:text="${product.productName}"></a><div class="product-price" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></div><small class="text-secondary" th:text="|Còn ${product.quantity} sản phẩm|"></small><form th:if="${currentUser != null and !isAdmin and !isManager}" method="post" th:action="@{/cart/add/{id}(id=${product.productId})}"><input type="hidden" name="quantity" value="1"><button class="btn btn-primary btn-sm w-100 mt-2" th:disabled="${product.quantity < 1}">Thêm vào giỏ</button></form></div>
        </article></div>
        <div class="col-12" th:if="${products.empty}"><div class="empty-state">Không tìm thấy sản phẩm phù hợp.</div></div>
    </div>
    <nav class="mt-4" th:if="${products.totalPages > 1}"><ul class="pagination justify-content-center"><li class="page-item" th:each="n : ${#numbers.sequence(0, products.totalPages - 1)}" th:classappend="${n == products.number} ? 'active'"><a class="page-link" th:href="@{/products(page=${n},categoryId=${selectedCategoryId},keyword=${keyword},sort=${sort})}" th:text="${n + 1}"></a></li></ul></nav>
    <section class="mt-5" th:if="${relatedVideos != null}">
        <div class="section-heading"><div><p class="eyebrow mb-1">NỘI DUNG LIÊN QUAN</p><h2>Video danh mục này</h2></div><a th:href="@{/videos(categoryId=${selectedCategoryId})}">Xem tất cả video →</a></div>
        <div class="row g-3">
            <div class="col-6 col-lg-3" th:each="video : ${relatedVideos}">
                <article class="product-card h-100"><a th:href="@{/videos/detail(id=${video.videoId})}"><div class="product-image-wrap"><img class="product-image" th:src="${video.poster != null ? video.poster : '/images/avatar.png'}" onerror="this.onerror=null;this.src='/images/avatar.png'" alt="Poster video"></div></a><div class="p-3"><a class="product-name" th:href="@{/videos/detail(id=${video.videoId})}" th:text="${video.title}"></a><small class="video-views d-inline-flex mt-2" th:text="|▶ ${video.views != null ? video.views : 0} lượt xem|"></small></div></article>
            </div>
            <div class="col-12" th:if="${#lists.isEmpty(relatedVideos)}"><div class="empty-state">Danh mục này chưa có video đang hiển thị.</div></div>
        </div>
    </section>
</main><div th:replace="~{fragments/shop-footer :: footer}"></div></body></html>
