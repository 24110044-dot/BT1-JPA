<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${video.title} + ' | CategoryHub'"></title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body class="shop-page"><div th:replace="~{fragments/shop-header :: header}"></div><main class="container shop-content">
    <section class="panel">
        <p class="eyebrow mb-1">VIDEO</p>
        <a class="product-category" th:if="${video.category != null}" th:href="@{/videos(categoryId=${video.category.cateId})}" th:text="${video.category.cateName}"></a>
        <h1 class="page-title mt-2" th:text="${video.title}"></h1>
        <div class="ratio ratio-16x9 my-4"><iframe th:src="|https://www.youtube-nocookie.com/embed/${video.videoId}|" title="Video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>
        <p class="text-secondary" th:text="${video.description}"></p>
        <small class="text-secondary" th:text="|${video.views != null ? video.views : 0} lượt xem|"></small>
    </section>
</main><div th:replace="~{fragments/shop-footer :: footer}"></div></body></html>
