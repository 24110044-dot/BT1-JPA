<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${product.productName} + ' | CategoryHub'"></title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body class="shop-page"><div th:replace="~{fragments/shop-header :: header}"></div><main class="container shop-content">
    <section class="panel product-detail">
        <div><img class="detail-image" th:src="${product.image != null ? product.image : '/images/avatar.png'}" onerror="this.onerror=null;this.src='/images/avatar.png'" alt="Ảnh sản phẩm"></div>
        <div><a class="product-category" th:href="@{/products/category/{id}(id=${product.category.cateId})}" th:text="${product.category.cateName}"></a><h1 class="page-title mt-2" th:text="${product.productName}"></h1><div class="detail-price" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></div><p class="text-secondary mt-3" th:text="${product.description}"></p><p><strong>Tồn kho:</strong> <span th:text="${product.quantity}"></span></p>
            <div th:if="${currentUser != null and (isAdmin or isManager)}" class="alert alert-info mt-3">Đăng nhập bằng tài khoản khách hàng để mua sản phẩm.</div>
            <div th:if="${currentUser != null and !isAdmin and !isManager}" class="d-flex flex-wrap gap-2">
                <form class="d-flex gap-2" method="post" th:action="@{/cart/add/{id}(id=${product.productId})}"><input class="form-control quantity-input" type="number" name="quantity" value="1" min="1" th:attr="max=${product.quantity}" required><button class="btn btn-primary" th:disabled="${product.quantity < 1}">Thêm vào giỏ</button></form>
                <form method="post" th:action="@{/cart/buy/{id}(id=${product.productId})}"><input type="hidden" name="quantity" value="1"><button class="btn btn-dark" th:disabled="${product.quantity < 1}">Mua ngay</button></form>
            </div>
            <div th:if="${currentUser == null}" class="d-flex gap-2"><a class="btn btn-primary" th:href="@{/login}">Đăng nhập để mua</a></div>
            <div th:if="${product.quantity < 1}" class="alert alert-warning mt-3 mb-0">Sản phẩm hiện đã hết hàng.</div>
        </div>
    </section>
</main><div th:replace="~{fragments/shop-footer :: footer}"></div></body></html>
