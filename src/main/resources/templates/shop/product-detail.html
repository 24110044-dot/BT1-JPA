<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${product.productName} + ' | CategoryHub'"></title>

    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="shop-page">
<div th:replace="~{fragments/shop-header :: header}"></div>
<main class="container shop-content">
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <section class="panel product-detail">
        <div class="detail-image-wrap">
            <img class="detail-image" th:src="${product.image != null ? product.image : '/images/avatar.png'}"
                 onerror="this.onerror=null;this.src='/images/avatar.png'" alt="Ảnh sản phẩm">
        </div>
        <div class="product-detail-info">
            <a class="product-category" th:href="@{/products/category/{id}(id=${product.category.cateId})}"
               th:text="${product.category.cateName}"></a>
            <h1 class="page-title mt-2" th:text="${product.productName}"></h1>
            <div class="detail-price"
                 th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></div>
            <p class="text-secondary mt-3 product-detail-description" th:text="${product.description}"></p>
            <p class="product-stock"><strong>Tồn kho:</strong> <span th:text="${product.quantity}"></span></p>

            <div th:if="${currentUser != null and (isAdmin or isManager)}"
                 class="alert alert-info mt-3">Đăng nhập bằng tài khoản khách hàng để mua sản phẩm.</div>
            <div th:if="${currentUser != null and !isAdmin and !isManager}"
                 class="product-detail-actions">
                <button class="btn btn-primary btn-lg" type="button" data-quantity-form="addToCartForm"
                        th:disabled="${product.quantity < 1}">Thêm vào giỏ</button>
                <button class="btn btn-dark btn-lg" type="button" data-quantity-form="buyNowForm"
                        th:disabled="${product.quantity < 1}">Mua ngay</button>
            </div>
            <div th:if="${currentUser == null}" class="product-detail-actions">
                <a class="btn btn-primary btn-lg" th:href="@{/login}">Đăng nhập để mua</a>
            </div>
            <div th:if="${product.quantity < 1}" class="alert alert-warning mt-3 mb-0">
                Sản phẩm hiện đã hết hàng.
            </div>

            <form id="addToCartForm" method="post" th:action="@{/cart/add/{id}(id=${product.productId})}" hidden>
                <input type="hidden" name="quantity" value="1">
            </form>
            <form id="buyNowForm" method="post"
                  th:action="@{/checkout/buy/{id}(id=${product.productId})}" hidden>
                <input type="hidden" name="quantity" value="1">
            </form>
        </div>
    </section>
</main>

<dialog id="quantityDialog" class="quantity-dialog" aria-labelledby="quantityDialogTitle">
    <form method="dialog" class="quantity-dialog-close">
        <button class="btn-close" aria-label="Đóng"></button>
    </form>
    <p class="eyebrow mb-2">CHỌN SỐ LƯỢNG</p>
    <h2 id="quantityDialogTitle" class="h4 mb-2" th:text="${product.productName}"></h2>
    <p class="text-secondary mb-4">Sản phẩm còn <strong th:text="${product.quantity}"></strong> trong kho.</p>
    <label class="form-label fw-semibold" for="selectedQuantity">Số lượng</label>
    <input id="selectedQuantity" class="form-control form-control-lg" type="number" value="1"
           min="1" th:attr="max=${product.quantity}" required>
    <div class="quantity-dialog-actions">
        <button id="cancelQuantity" class="btn btn-light" type="button">Hủy</button>
        <button id="confirmQuantity" class="btn btn-primary" type="button">Tiếp tục</button>
    </div>
</dialog>

<div th:replace="~{fragments/shop-footer :: footer}"></div>
<script>
    (() => {
        const dialog = document.getElementById("quantityDialog");
        const quantityInput = document.getElementById("selectedQuantity");
        let selectedFormId = null;

        document.querySelectorAll("[data-quantity-form]").forEach((button) => {
            button.addEventListener("click", () => {
                selectedFormId = button.dataset.quantityForm;
                quantityInput.value = "1";
                dialog.showModal();
                quantityInput.focus();
            });
        });

        document.getElementById("cancelQuantity").addEventListener("click", () => dialog.close());
        document.getElementById("confirmQuantity").addEventListener("click", () => {
            if (!quantityInput.reportValidity()) return;
            const form = document.getElementById(selectedFormId);
            form.querySelector('input[name="quantity"]').value = quantityInput.value;
            form.requestSubmit();
        });
    })();
</script>
</body>
</html>
