<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Đặt hàng thành công</title><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body class="shop-page"><div th:replace="~{fragments/shop-header :: header}"></div><main class="container shop-content"><section class="success-panel">
    <div class="success-check">✓</div><p class="eyebrow text-primary">ORDER RECEIVED</p><h1>Đặt hàng thành công</h1><p class="text-secondary">Mã đơn hàng <strong th:text="|#${order.orderId}|"></strong></p><p th:if="${order.paymentMethod == 'DEMO'}" class="alert alert-info">Đây là thanh toán mô phỏng. Không có khoản tiền thật nào được thu; trạng thái thanh toán là chưa thu tiền.</p><p th:if="${order.paymentMethod == 'COD'}" class="text-secondary">Bạn thanh toán khi nhận hàng.</p><a class="btn btn-primary" th:href="@{/member/orders/{id}(id=${order.orderId})}">Xem đơn hàng</a> <a class="btn btn-light" th:href="@{/products}">Tiếp tục mua sắm</a>
</section></main><div th:replace="~{fragments/shop-footer :: footer}"></div></body></html>
