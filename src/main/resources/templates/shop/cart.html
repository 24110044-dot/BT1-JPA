<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Giỏ hàng | CategoryHub</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body class="shop-page"><div th:replace="~{fragments/shop-header :: header}"></div><main class="container shop-content">
    <div class="section-heading mb-4"><div><p class="eyebrow mb-1">YOUR BAG</p><h1>Giỏ hàng</h1></div><a th:href="@{/products}">Tiếp tục mua sắm</a></div>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <div class="empty-state" th:if="${cart.items.empty}">Giỏ hàng đang trống. <a th:href="@{/products}">Khám phá sản phẩm</a></div>
    <div class="row g-4" th:unless="${cart.items.empty}">
        <div class="col-lg-8"><section class="panel p-0 overflow-hidden"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Sản phẩm</th><th>Đơn giá</th><th>Số lượng</th><th>Tạm tính</th><th></th></tr></thead><tbody>
            <tr th:each="item : ${cart.items}"><td><div class="d-flex align-items-center gap-2"><img class="cart-product-image" th:src="${item.product.image != null ? item.product.image : '/images/avatar.png'}" onerror="this.onerror=null;this.src='/images/avatar.png'" alt=""><div><a class="product-name" th:href="@{/products/detail/{id}(id=${item.product.productId})}" th:text="${item.product.productName}"></a><small class="d-block text-secondary" th:if="${!item.product.status}">Sản phẩm ngừng kinh doanh</small></div></div></td><td th:text="${#numbers.formatDecimal(item.unitPrice, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></td><td><form class="d-flex gap-1" method="post" th:action="@{/cart/update/{id}(id=${item.cartItemId})}"><input class="form-control form-control-sm quantity-input" type="number" min="1" th:attr="max=${item.product.quantity}" name="quantity" th:value="${item.quantity}"><button class="btn btn-sm btn-outline-primary">Cập nhật</button></form></td><td class="fw-semibold" th:text="${#numbers.formatDecimal(item.subtotal, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></td><td><form method="post" th:action="@{/cart/remove/{id}(id=${item.cartItemId})}"><button class="btn btn-sm btn-outline-danger">Xóa</button></form></td></tr>
        </tbody></table></div></section><form class="mt-3 text-end" method="post" th:action="@{/cart/clear}"><button class="btn btn-outline-danger btn-sm">Xóa toàn bộ giỏ</button></form></div>
        <div class="col-lg-4"><section class="panel"><h2 class="h5">Tóm tắt đơn hàng</h2><div class="d-flex justify-content-between mt-3"><span>Tổng cộng</span><strong class="product-price" th:text="${#numbers.formatDecimal(cart.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></strong></div><p class="text-secondary small mt-2">Giá và tồn kho sẽ được kiểm tra lại khi đặt hàng.</p><a class="btn btn-primary w-100" th:href="@{/checkout}">Tiến hành thanh toán</a></section></div>
    </div>
</main><div th:replace="~{fragments/shop-footer :: footer}"></div></body></html>
