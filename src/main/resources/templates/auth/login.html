<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Đăng nhập | CategoryHub</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body class="auth-page">
<main class="auth-card">
    <a class="brand auth-brand" th:href="@{/home}"><span class="brand-mark">C</span><span>Category<span class="brand-light">Hub</span></span></a>
    <p class="eyebrow mt-4 mb-1">CHÀO MỪNG TRỞ LẠI</p><h1 class="page-title mb-2">Đăng nhập</h1><p class="text-secondary mb-4">Đăng nhập để tiếp tục vào không gian của bạn.</p>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${param.error != null and param.error[0] == 'invalid'}" class="alert alert-danger">Tài khoản hoặc mật khẩu không đúng.</div>
    <div th:if="${param.error != null and param.error[0] == 'username'}" class="alert alert-danger">Vui lòng nhập username.</div>
    <div th:if="${param.error != null and param.error[0] == 'password'}" class="alert alert-danger">Vui lòng nhập mật khẩu.</div>
    <div th:if="${param.logout}" class="alert alert-info">Bạn đã đăng xuất.</div>
    <form method="post" th:action="@{/login}">
        <div class="mb-3"><label class="form-label" for="username">Username</label><input class="form-control" id="username" name="username" autocomplete="username" required autofocus></div>
        <div class="mb-3"><label class="form-label" for="password">Mật khẩu</label><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required></div>
        <div class="form-check mb-4"><input class="form-check-input" id="remember-me" name="remember-me" type="checkbox"><label class="form-check-label" for="remember-me">Ghi nhớ đăng nhập</label></div>
        <button class="btn btn-primary w-100 py-2">Đăng nhập</button>
    </form>
    <p class="text-center text-secondary mt-4 mb-0">Chưa có tài khoản? <a th:href="@{/register}">Đăng ký</a></p>
</main>
</body></html>
