<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kích hoạt tài khoản | CategoryHub</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body class="auth-page">
<main class="auth-card otp-card">
    <a class="brand auth-brand" th:href="@{/home}"><span class="brand-mark">C</span><span>Category<span class="brand-light">Hub</span></span></a>
    <div class="otp-icon" aria-hidden="true"><span>✉</span></div>
    <p class="eyebrow mt-4 mb-1">XÁC THỰC EMAIL</p>
    <h1 class="page-title mb-2">Kích hoạt tài khoản</h1>
    <p class="text-secondary mb-4">Nhập mã xác minh gồm 6 chữ số đã gửi đến email của bạn. Mã có hiệu lực trong 5 phút.</p>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <form method="post" th:action="@{/activate}" data-otp-form>
        <div class="mb-4"><label class="form-label" for="email">Email nhận mã</label><input class="form-control" id="email" name="email" type="email" th:value="${email}" autocomplete="email" required></div>
        <fieldset class="otp-fieldset mb-4">
            <legend class="form-label">Mã xác minh</legend>
            <div class="otp-inputs" role="group" aria-label="Nhập mã OTP gồm 6 chữ số" hidden>
                <input class="otp-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="Chữ số thứ nhất" data-otp-digit disabled>
                <input class="otp-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Chữ số thứ hai" data-otp-digit disabled>
                <input class="otp-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Chữ số thứ ba" data-otp-digit disabled>
                <input class="otp-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Chữ số thứ tư" data-otp-digit disabled>
                <input class="otp-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Chữ số thứ năm" data-otp-digit disabled>
                <input class="otp-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Chữ số thứ sáu" data-otp-digit disabled>
            </div>
            <input class="form-control otp-code-fallback" type="text" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="Nhập 6 chữ số" aria-label="Mã xác minh gồm 6 chữ số" required data-otp-fallback>
            <input type="hidden" data-otp-value>
        </fieldset>
        <button class="btn btn-primary w-100 py-2" type="submit">Xác minh và kích hoạt</button>
    </form>
    <div class="otp-resend mt-4">
        <span class="text-secondary">Chưa nhận được mã?</span>
        <form class="d-inline" method="post" th:action="@{/activate/resend}" data-resend-form>
        <input type="hidden" name="email" th:value="${email}">
            <button class="btn btn-link p-0 align-baseline" type="submit" data-resend-button>Gửi lại mã</button>
        </form>
        <span class="otp-countdown text-secondary" data-resend-countdown aria-live="polite"></span>
    </div>
    <p class="text-center text-secondary mt-4 mb-0"><a th:href="@{/login}">Quay lại đăng nhập</a></p>
</main>
<script th:src="@{/js/otp-input.js}" defer></script>
</body></html>
