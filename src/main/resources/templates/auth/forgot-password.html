<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quên mật khẩu | CategoryHub</title><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body class="auth-page">
<main class="auth-card">
    <a class="brand auth-brand" th:href="@{/home}"><span class="brand-mark">C</span><span>Category<span class="brand-light">Hub</span></span></a>
    <p class="eyebrow mt-4 mb-1">KHÔI PHỤC TÀI KHOẢN</p><h1 class="page-title mb-2">Quên mật khẩu</h1>
    <p class="text-secondary mb-4">Nhập email đã đăng ký để nhận mã xác minh đặt lại mật khẩu.</p>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <p th:if="${recoveryEmail}" class="mb-3"><a th:href="@{/forgot-password/verify(email=${recoveryEmail})}">Tôi đã nhận được mã OTP</a></p>
    <form method="post" th:action="@{/forgot-password}" th:object="${form}" class="needs-validation" novalidate>
        <div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" id="email" th:field="*{email}" type="email" maxlength="254" autocomplete="email" required th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"><div class="invalid-feedback" th:errors="*{email}"></div></div>
        <button class="btn btn-primary w-100 py-2">Gửi mã xác minh</button>
    </form>
    <p class="text-center text-secondary mt-4 mb-0"><a th:href="@{/login}">Quay lại đăng nhập</a></p>
</main>


</body></html>
