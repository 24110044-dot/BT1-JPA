<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Đặt lại mật khẩu | CategoryHub</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body class="auth-page">
<main class="auth-card">
    <a class="brand auth-brand" th:href="@{/home}"><span class="brand-mark">C</span><span>Category<span class="brand-light">Hub</span></span></a>
    <p class="eyebrow mt-4 mb-1">KHÔI PHỤC TÀI KHOẢN</p><h1 class="page-title mb-2">Đặt mật khẩu mới</h1>
    <p class="text-secondary mb-4">Mật khẩu mới cần từ 8 đến 72 ký tự.</p>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <form method="post" th:action="@{/reset-password}">
        <div class="mb-3"><label class="form-label" for="password">Mật khẩu mới</label><input class="form-control" id="password" name="password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required></div>
        <div class="mb-3"><label class="form-label" for="confirmPassword">Xác nhận mật khẩu</label><input class="form-control" id="confirmPassword" name="confirmPassword" type="password" minlength="8" maxlength="72" autocomplete="new-password" required></div>
        <button class="btn btn-primary w-100 py-2">Cập nhật mật khẩu</button>
    </form>
</main>
</body></html>
