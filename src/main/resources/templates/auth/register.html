<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Đăng ký | CategoryHub</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body class="auth-page">
<main class="auth-card auth-card-wide">
    <a class="brand auth-brand" th:href="@{/home}"><span class="brand-mark">C</span><span>Category<span class="brand-light">Hub</span></span></a>
    <p class="eyebrow mt-4 mb-1">TẠO TÀI KHOẢN</p><h1 class="page-title mb-4">Đăng ký</h1>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <form method="post" th:action="@{/register}" th:object="${form}">
        <div class="row g-3">
            <div class="col-md-6"><label class="form-label">Username</label><input class="form-control" th:field="*{userName}" autocomplete="username"><div class="field-error" th:errors="*{userName}"></div></div>
            <div class="col-md-6"><label class="form-label">Họ tên</label><input class="form-control" th:field="*{fullName}"><div class="field-error" th:errors="*{fullName}"></div></div>
            <div class="col-md-6"><label class="form-label">Email</label><input class="form-control" th:field="*{email}" type="email" autocomplete="email"><div class="field-error" th:errors="*{email}"></div></div>
            <div class="col-md-6"><label class="form-label">Số điện thoại</label><input class="form-control" th:field="*{phone}" autocomplete="tel"><div class="field-error" th:errors="*{phone}"></div></div>
            <div class="col-md-6"><label class="form-label">Mật khẩu</label><input class="form-control" th:field="*{password}" type="password" autocomplete="new-password"><div class="field-error" th:errors="*{password}"></div></div>
            <div class="col-md-6"><label class="form-label">Xác nhận mật khẩu</label><input class="form-control" th:field="*{confirmPassword}" type="password" autocomplete="new-password"><div class="field-error" th:errors="*{confirmPassword}"></div></div>
        </div>
        <button class="btn btn-primary w-100 py-2 mt-4">Tạo tài khoản</button>
    </form>
    <p class="text-center text-secondary mt-4 mb-0">Đã có tài khoản? <a th:href="@{/login}">Đăng nhập</a></p>
</main>
</body></html>
