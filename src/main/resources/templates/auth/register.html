<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Đăng ký | CategoryHub</title><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body class="auth-page">
<main class="auth-card auth-card-wide">
    <a class="brand auth-brand" th:href="@{/home}"><span class="brand-mark">C</span><span>Category<span class="brand-light">Hub</span></span></a>
    <p class="eyebrow mt-4 mb-1">TẠO TÀI KHOẢN</p><h1 class="page-title mb-4">Đăng ký</h1>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <form method="post" th:action="@{/register}" th:object="${form}">
        <div class="row g-3">
            <div class="col-md-6"><label class="form-label" for="userName">Username</label><input class="form-control" id="userName" th:field="*{userName}" minlength="3" maxlength="50" pattern="[a-zA-Z0-9._-]+" autocomplete="username" required th:classappend="${#fields.hasErrors('userName')} ? 'is-invalid'"><div class="invalid-feedback" th:errors="*{userName}"></div></div>
            <div class="col-md-6"><label class="form-label" for="fullName">Họ tên</label><input class="form-control" id="fullName" th:field="*{fullName}" minlength="1" maxlength="100" required th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'"><div class="invalid-feedback" th:errors="*{fullName}"></div></div>
            <div class="col-md-6"><label class="form-label" for="email">Email</label><input class="form-control" id="email" th:field="*{email}" type="email" maxlength="254" autocomplete="email" required th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"><div class="invalid-feedback" th:errors="*{email}"></div></div>
            <div class="col-md-6"><label class="form-label" for="phone">Số điện thoại</label><input class="form-control" id="phone" th:field="*{phone}" minlength="8" maxlength="20" pattern="[0-9+() .-]+" autocomplete="tel" required th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'"><div class="invalid-feedback" th:errors="*{phone}"></div></div>
            <div class="col-md-6"><label class="form-label" for="password">Mật khẩu</label><input class="form-control" id="password" th:field="*{password}" type="password" minlength="8" maxlength="72" autocomplete="new-password" required th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"><div class="invalid-feedback" th:errors="*{password}"></div></div>
            <div class="col-md-6"><label class="form-label" for="confirmPassword">Xác nhận mật khẩu</label><input class="form-control" id="confirmPassword" th:field="*{confirmPassword}" type="password" minlength="8" maxlength="72" autocomplete="new-password" required th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"><div class="invalid-feedback" th:errors="*{confirmPassword}"></div></div>
        </div>
        <button class="btn btn-primary w-100 py-2 mt-4">Tạo tài khoản</button>
    </form>
    <p class="text-center text-secondary mt-4 mb-0">Đã có tài khoản? <a th:href="@{/login}">Đăng nhập</a></p>
</main>


</body></html>
