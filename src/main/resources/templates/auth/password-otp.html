<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Xác minh OTP | CategoryHub</title><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body class="auth-page">
<main class="auth-card otp-card">
    <a class="brand auth-brand" th:href="@{/home}"><span class="brand-mark">C</span><span>Category<span class="brand-light">Hub</span></span></a>
    <div class="otp-icon" aria-hidden="true"><span>✉</span></div>
    <p class="eyebrow mt-4 mb-1">KHÔI PHỤC TÀI KHOẢN</p>
    <h1 class="page-title mb-2">Xác minh email</h1>
    <p class="text-secondary mb-4">Nhập mã 6 chữ số đã gửi đến email của bạn. Mã có hiệu lực trong 5 phút và chỉ dùng một lần.</p>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <form method="post" th:action="@{/forgot-password/verify}" th:object="${form}" data-otp-form class="needs-validation" novalidate>
        <div class="mb-4"><label class="form-label" for="email">Email nhận mã</label><input class="form-control" id="email" th:field="*{email}" type="email" maxlength="254" autocomplete="email" required th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"><div class="invalid-feedback" th:errors="*{email}"></div></div>
        <fieldset class="otp-fieldset mb-4">
            <legend class="form-label">Mã xác minh</legend>
            <div class="otp-inputs" role="group" aria-label="Nhập mã OTP gồm 6 chữ số" hidden>
                <input class="otp-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="Chữ số thứ nhất" data-otp-digit disabled>
                <input class="otp-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Chữ số thứ hai" data-otp-digit disabled>
                <input class="otp-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Chữ số thứ ba" data-otp-digit disabled>
                <input class="otp-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Chữ số thứ tư" data-otp-digit disabled>
                <input class="otp-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Chữ số thứ năm" data-otp-digit disabled>
                <input class="otp-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Chữ số thứ sáu" data-otp-digit disabled>
            </div>
            <input class="form-control otp-code-fallback" type="text" th:field="*{code}" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" minlength="6" autocomplete="one-time-code" placeholder="Nhập 6 chữ số" aria-label="Mã xác minh gồm 6 chữ số" required th:classappend="${#fields.hasErrors('code')} ? 'is-invalid'" data-otp-fallback>
            <div class="invalid-feedback" th:errors="*{code}"></div>
            <input type="hidden" data-otp-value>
        </fieldset>
        <button class="btn btn-primary w-100 py-2" type="submit">Xác minh mã</button>
    </form>
    <div class="otp-resend mt-4">
        <span class="text-secondary">Chưa nhận được mã?</span>
        <form method="post" th:action="@{/forgot-password}" class="d-inline">
            <input type="hidden" name="email" th:value="${form.email}">
            <button class="btn btn-link p-0 align-baseline" type="submit">Gửi lại mã</button>
        </form>
    </div>
    <p class="text-center text-secondary mt-4 mb-0"><a th:href="@{/forgot-password}">Đổi email</a></p>
</main>
<script th:src="@{/js/otp-input.js}" defer></script>


</body></html>
