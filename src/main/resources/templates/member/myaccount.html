<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tài khoản của tôi | CategoryHub</title>

    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="shop-page">
<div th:replace="~{fragments/shop-header :: header}"></div>
<main class="container shop-content">
    <div class="section-heading mb-4">
        <div><p class="eyebrow mb-1">TÀI KHOẢN</p><h1>Thông tin của tôi</h1></div>
        <a th:href="@{/member/orders}">Xem đơn hàng →</a>
    </div>
    <section class="panel profile-card">
        <div class="text-center mb-4">
            <img class="profile-avatar mb-3"
                 th:src="${currentUser.avatar != null ? currentUser.avatar : '/images/avatar.png'}"
                 onerror="this.onerror=null;this.src='/images/avatar.png'" alt="Ảnh đại diện">
            <h2 class="h4 fw-bold mb-1" th:text="${currentUser.fullName}"></h2>
            <span class="badge rounded-pill text-bg-primary"
                  th:text="${isAdmin ? 'ADMIN' : (isManager ? 'MANAGER' : 'KHÁCH HÀNG')}"></span>
        </div>
        <div class="profile-detail"><span>Tên đăng nhập</span><strong th:text="${currentUser.username}"></strong></div>
        <div class="profile-detail"><span>Email</span><strong th:text="${currentUser.email}"></strong></div>
        <div class="profile-detail"><span>Số điện thoại</span><strong th:text="${currentUser.phone}"></strong></div>
        <div class="d-flex flex-wrap justify-content-center gap-2 mt-4">
            <a class="btn btn-primary" th:href="@{/member/orders}">Đơn hàng của tôi</a>
            <a class="btn btn-outline-primary" th:href="@{/products}">Tiếp tục mua sắm</a>
        </div>
    </section>
</main>
<div th:replace="~{fragments/shop-footer :: footer}"></div>
</body>
</html>
