<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${isEdit ? 'Sửa video' : 'Tải video lên'} + ' | CategoryHub'">Video | CategoryHub</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body class="shop-page">
<div th:replace="~{fragments/shop-header :: header}"></div>
<main class="container shop-content py-4"><div class="auth-card auth-card-wide">
    <p class="eyebrow mb-1">QUẢN LÝ VIDEO</p><h1 class="page-title mb-4" th:text="${isEdit ? 'Sửa video' : 'Tải video lên'}"></h1>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <form method="post" enctype="multipart/form-data" th:action="${isEdit ? '/video/edit?id=' + videoId : '/video/add'}" th:object="${form}">
        <div class="mb-3"><label class="form-label" for="title">Tiêu đề</label><input class="form-control" id="title" th:field="*{title}" maxlength="255" required><div class="field-error" th:errors="*{title}"></div></div>
        <div class="mb-3"><label class="form-label" for="description">Mô tả</label><textarea class="form-control" id="description" th:field="*{description}" rows="5" maxlength="4000"></textarea><div class="field-error" th:errors="*{description}"></div></div>
        <div class="mb-3"><label class="form-label" for="poster">Đường dẫn thumbnail (không bắt buộc)</label><input class="form-control" id="poster" th:field="*{poster}" maxlength="500" placeholder="https://example.com/thumbnail.jpg"><div class="field-error" th:errors="*{poster}"></div></div>
        <div class="mb-3"><label class="form-label" for="file">Tệp video <span th:if="${isEdit}">(chọn tệp mới nếu muốn thay)</span></label><input class="form-control" id="file" name="file" type="file" accept=".mp4,.webm,.ogv,video/mp4,video/webm,video/ogg" th:required="${!isEdit}"><small class="text-secondary">Hỗ trợ MP4, WebM, Ogg; tối đa 200 MB.</small><div th:if="${isEdit}" class="text-secondary small mt-1">Bỏ trống để giữ nguyên tệp hiện tại.</div><div class="field-error" th:errors="*{file}"></div></div>
        <div class="d-flex gap-2"><button class="btn btn-primary" type="submit" th:text="${isEdit ? 'Lưu thay đổi' : 'Tải lên'}"></button><a class="btn btn-outline-secondary" th:href="@{/video}">Hủy</a></div>
    </form>
</div></main>
<div th:replace="~{fragments/shop-footer :: footer}"></div>
</body></html>
