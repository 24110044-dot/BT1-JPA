<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Video của tôi | CategoryHub</title><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body class="shop-page">
<div th:replace="~{fragments/shop-header :: header}"></div>
<main class="container shop-content py-4">
    <div class="section-heading video-library-heading">
        <div><p class="eyebrow mb-1">THƯ VIỆN CỦA BẠN</p><h1>Video của tôi</h1><p class="text-secondary mb-0">Quản lý video bạn đã chia sẻ</p></div>
        <a class="btn btn-primary upload-video-cta" th:href="@{/video/add}">
            <span class="upload-video-cta-icon" aria-hidden="true">+</span>
            <span class="upload-video-cta-copy"><strong>Tải video lên</strong><small>Chia sẻ video mới</small></span>
            <span class="upload-video-cta-arrow" aria-hidden="true">→</span>
        </a>
    </div>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <div class="row g-3">
        <div class="col-6 col-lg-4" th:each="video : ${videos.content}">
            <article class="product-card h-100">
                <a th:href="@{/video/{id}(id=${video.videoId})}"><div class="product-image-wrap"><img class="product-image" th:src="${video.poster != null ? video.poster : '/images/avatar.png'}" onerror="this.onerror=null;this.src='/images/avatar.png'" alt="Thumbnail video"></div></a>
                <div class="p-3"><a class="product-name" th:href="@{/video/{id}(id=${video.videoId})}" th:text="${video.title}"></a><small class="video-views d-inline-flex mt-2" th:text="|▶ ${video.views != null ? video.views : 0} lượt xem|"></small><small class="text-secondary d-block mt-1" th:if="${video.uploadedAt != null}" th:text="${#temporals.format(video.uploadedAt, 'dd/MM/yyyy HH:mm')}"></small>
                    <div class="d-flex gap-2 mt-3"><a class="btn btn-outline-primary btn-sm" th:href="@{/video/edit(id=${video.videoId})}">Sửa</a><form method="post" th:action="@{/video/delete}"><input type="hidden" name="id" th:value="${video.videoId}"><button class="btn btn-outline-danger btn-sm" type="submit" onclick="return confirm('Xóa video này?')">Xóa</button></form></div>
                </div>
            </article>
        </div>
    </div>
    <div class="empty-state" th:if="${videos.empty}">Bạn chưa tải video nào lên.</div>
    <nav th:if="${videos.totalPages > 1}" aria-label="Phân trang video" class="mt-4"><ul class="pagination justify-content-center">
        <li class="page-item" th:classappend="${videos.first ? 'disabled' : ''}"><a class="page-link" th:href="@{/video(page=${videos.number - 1})}">Trước</a></li>
        <li class="page-item" th:each="pageNumber : ${#numbers.sequence(0, videos.totalPages - 1)}" th:classappend="${pageNumber == videos.number ? 'active' : ''}"><a class="page-link" th:href="@{/video(page=${pageNumber})}" th:text="${pageNumber + 1}"></a></li>
        <li class="page-item" th:classappend="${videos.last ? 'disabled' : ''}"><a class="page-link" th:href="@{/video(page=${videos.number + 1})}">Sau</a></li>
    </ul></nav>
</main>
<div th:replace="~{fragments/shop-footer :: footer}"></div>
</body></html>
