<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sản phẩm</title><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body><div th:replace="~{fragments/sidebar :: sidebar}"></div><div class="app-main"><div th:replace="~{fragments/topbar :: topbar}"></div><main class="content">
    <p class="eyebrow mb-1">CATALOG</p><h1 class="page-title mb-4">Sản phẩm đang bán</h1><div class="row g-3"><div class="col-6 col-lg-3" th:each="product : ${products.content}"><article class="product-card"><a th:href="@{/products/detail/{id}(id=${product.productId})}"><img class="product-image" th:src="${product.image != null ? product.image : '/images/avatar.png'}" onerror="this.onerror=null;this.src='/images/avatar.png'" alt=""></a><div class="p-3"><span class="product-category" th:text="${product.category.cateName}"></span><a class="product-name" th:href="@{/products/detail/{id}(id=${product.productId})}" th:text="${product.productName}"></a><div class="product-price" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></div></div></article></div></div>
</main></div></body></html>
