<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Danh mục</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body><div th:replace="~{fragments/sidebar :: sidebar}"></div><div class="app-main"><div th:replace="~{fragments/topbar :: topbar}"></div><main class="content">
    <p class="eyebrow mb-1">CATALOG</p><h1 class="page-title mb-4">Danh mục</h1>
    <section class="panel"><form class="row g-2 mb-3" method="get" th:action="@{/manager/category/list}"><div class="col-sm-10"><input class="form-control" name="keyword" placeholder="Tìm tên danh mục..." th:value="${keyword}"></div><div class="col-sm-2 d-grid"><button class="btn btn-outline-primary">Tìm kiếm</button></div></form>
        <div class="table-responsive"><table class="table align-middle"><thead><tr><th>ID</th><th>Ảnh</th><th>Tên danh mục</th><th></th></tr></thead><tbody>
            <tr th:each="category : ${categories.content}"><td th:text="${category.cateId}"></td><td><img class="category-thumb" th:src="${category.icon != null ? category.icon : '/images/avatar.png'}" onerror="this.onerror=null;this.src='/images/avatar.png'" alt="Ảnh"></td><td th:text="${category.cateName}"></td><td class="text-end"><a class="btn btn-sm btn-outline-primary" th:href="@{/manager/category/detail/{id}(id=${category.cateId})}">Chi tiết</a></td></tr>
            <tr th:if="${categories.empty}"><td colspan="4" class="text-center py-4">Không có danh mục.</td></tr>
        </tbody></table></div>
        <nav th:if="${categories.totalPages > 1}"><ul class="pagination justify-content-center"><li class="page-item" th:each="n : ${#numbers.sequence(0, categories.totalPages - 1)}" th:classappend="${n == categories.number} ? 'active'"><a class="page-link" th:href="@{/manager/category/list(page=${n},keyword=${keyword})}" th:text="${n + 1}"></a></li></ul></nav>
    </section>
</main></div></body></html>
