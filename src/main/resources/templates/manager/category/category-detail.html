<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chi tiết danh mục</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body><div th:replace="~{fragments/sidebar :: sidebar}"></div><div class="app-main"><div th:replace="~{fragments/topbar :: topbar}"></div><main class="content form-content">
    <p class="eyebrow">CATALOG</p><h1 class="page-title mb-4">Chi tiết danh mục</h1><section class="panel"><img class="category-preview mb-3" th:src="${category.icon != null ? category.icon : '/images/avatar.png'}" onerror="this.onerror=null;this.src='/images/avatar.png'" alt="Ảnh danh mục"><p><strong>ID:</strong> <span th:text="${category.cateId}"></span></p><p><strong>Tên:</strong> <span th:text="${category.cateName}"></span></p><a class="btn btn-light" th:href="@{/manager/category/list}">Quay lại</a></section>
</main></div></body></html>
