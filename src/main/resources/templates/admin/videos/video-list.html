<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quản lý video</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body><div th:replace="~{fragments/sidebar :: sidebar}"></div><div class="app-main"><div th:replace="~{fragments/topbar :: topbar}"></div><main class="content">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4"><div><p class="eyebrow mb-1">CATALOG</p><h1 class="page-title">Video</h1><p class="text-secondary mb-0" th:text="|${totalVideos} video|">0 video</p></div><a class="btn btn-primary" th:href="@{/admin/videos/add}">+ Thêm video</a></div>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <section class="panel">
        <form class="row g-2 mb-3" method="get" th:action="@{/admin/videos}">
            <div class="col-lg-5"><input class="form-control" name="keyword" placeholder="Tìm tiêu đề hoặc mã video..." th:value="${keyword}"></div>
            <div class="col-lg-3"><select class="form-select" name="categoryId"><option value="">Tất cả danh mục</option><option th:each="category : ${categories}" th:value="${category.cateId}" th:text="${category.cateName}" th:selected="${selectedCategoryId == category.cateId}"></option></select></div>
            <div class="col-lg-2"><select class="form-select" name="active"><option value="">Mọi trạng thái</option><option value="true" th:selected="${selectedActive == true}">Đang hiển thị</option><option value="false" th:selected="${selectedActive == false}">Đã ẩn</option></select></div>
            <div class="col-lg-2 d-grid"><button class="btn btn-outline-primary">Lọc</button></div>
        </form>
        <div class="table-responsive"><table class="table align-middle"><thead><tr><th>Video</th><th>Mã</th><th>Danh mục</th><th>Lượt xem</th><th>Trạng thái</th><th class="text-end">Thao tác</th></tr></thead><tbody>
            <tr th:each="video : ${videos.content}">
                <td><div class="d-flex align-items-center gap-2"><img class="mini-avatar rounded-3" th:src="${video.poster != null ? video.poster : '/images/avatar.png'}" onerror="this.onerror=null;this.src='/images/avatar.png'" alt="Poster video"><span class="fw-semibold" th:text="${video.title}"></span></div></td>
                <td class="text-secondary" th:text="${video.videoId}"></td><td th:text="${video.category != null ? video.category.cateName : 'Chưa phân loại'}"></td><td th:text="${video.views != null ? video.views : 0}"></td>
                <td><span class="badge" th:classappend="${video.active} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${video.active} ? 'Đang hiển thị' : 'Đã ẩn'"></span></td>
                <td class="text-end text-nowrap"><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/videos/edit(id=${video.videoId})}">Sửa</a><form th:if="${video.active}" class="d-inline" method="post" th:action="@{/admin/videos/hide}"><input type="hidden" name="id" th:value="${video.videoId}"><button class="btn btn-sm btn-outline-danger" onclick="return confirm('Ẩn video này?')">Ẩn</button></form></td>
            </tr>
            <tr th:if="${videos.empty}"><td colspan="6" class="text-center text-secondary py-5">Chưa có video phù hợp.</td></tr>
        </tbody></table></div>
        <nav th:if="${videos.totalPages > 1}"><ul class="pagination justify-content-center mb-0">
            <li class="page-item" th:classappend="${videos.first} ? 'disabled'"><a class="page-link" th:href="@{/admin/videos(page=${videos.number - 1},keyword=${keyword},categoryId=${selectedCategoryId},active=${selectedActive})}">Trước</a></li>
            <li class="page-item" th:each="n : ${#numbers.sequence(0, videos.totalPages - 1)}" th:classappend="${n == videos.number} ? 'active'"><a class="page-link" th:href="@{/admin/videos(page=${n},keyword=${keyword},categoryId=${selectedCategoryId},active=${selectedActive})}" th:text="${n + 1}"></a></li>
            <li class="page-item" th:classappend="${videos.last} ? 'disabled'"><a class="page-link" th:href="@{/admin/videos(page=${videos.number + 1},keyword=${keyword},categoryId=${selectedCategoryId},active=${selectedActive})}">Sau</a></li>
        </ul></nav>
    </section>
</main></div></body></html>
