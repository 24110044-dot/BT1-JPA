<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Video</title><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body><div th:replace="~{fragments/sidebar :: sidebar}"></div><div class="app-main"><div th:replace="~{fragments/topbar :: topbar}"></div><main class="content form-content">
    <p class="eyebrow mb-1">CATALOG</p><h1 class="page-title mb-4" th:text="${isNew} ? 'Thêm video' : 'Cập nhật video'"></h1><div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <section class="panel"><div th:if="${#lists.isEmpty(categories)}" class="alert alert-warning">Chưa có danh mục. Bạn vẫn có thể lưu video và phân loại sau.</div>
        <form method="post" th:action="${isNew} ? @{/admin/videos/add} : @{/admin/videos/edit(id=${videoId})}" th:object="${form}" class="needs-validation" novalidate>
            <div class="row g-3">
                <div class="col-md-4" th:if="${isNew}"><label class="form-label" for="videoId">Mã video YouTube</label><input id="videoId" class="form-control" th:field="*{videoId}" minlength="1" maxlength="50" placeholder="Nhập mã video, không nhập URL" required th:classappend="${#fields.hasErrors('videoId')} ? 'is-invalid'"><div class="form-text">Dùng mã video YouTube (phần sau v= hoặc cuối đường dẫn youtu.be), tối đa 50 ký tự.</div><div class="invalid-feedback" th:errors="*{videoId}"></div></div>
                <div class="col-md-4" th:unless="${isNew}"><label class="form-label">Mã video</label><input class="form-control" th:field="*{videoId}" placeholder="Nhập mã video YouTube"><div class="form-text">Mã phải có giá trị và chưa được video khác sử dụng.</div><div class="field-error" th:errors="*{videoId}"></div></div>
                <div class="col-md-8"><label class="form-label" for="title">Tiêu đề</label><input id="title" class="form-control" th:field="*{title}" minlength="1" maxlength="255" required th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'"><div class="invalid-feedback" th:errors="*{title}"></div></div>
                <div class="col-md-6"><label class="form-label">Danh mục</label><select class="form-select" th:field="*{categoryId}"><option value="">Chưa phân loại</option><option th:each="category : ${categories}" th:value="${category.cateId}" th:text="${category.cateName}"></option></select><div class="field-error" th:errors="*{categoryId}"></div></div>
                <div class="col-md-3"><label class="form-label">Lượt xem</label><input class="form-control" type="number" min="0" th:field="*{views}"><div class="field-error" th:errors="*{views}"></div></div>
                <div class="col-md-3"><label class="form-label">Trạng thái</label><select class="form-select" th:field="*{active}"><option value="true">Đang hiển thị</option><option value="false">Ẩn</option></select></div>
                <div class="col-12"><label class="form-label">Đường dẫn poster</label><input class="form-control" th:field="*{poster}" placeholder="URL ảnh hoặc đường dẫn ảnh trong ứng dụng"><div class="field-error" th:errors="*{poster}"></div></div>
                <div class="col-12"><label class="form-label" for="description">Mô tả</label><textarea id="description" class="form-control" rows="5" maxlength="4000" th:field="*{description}" th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"></textarea><div class="invalid-feedback" th:errors="*{description}"></div></div>
            </div><div class="mt-4"><button class="btn btn-primary" th:text="${isNew} ? 'Tạo video' : 'Lưu thay đổi'"></button> <a class="btn btn-light" th:href="@{/admin/videos}">Hủy</a></div>
        </form>
    </section>
</main></div></body></html>
