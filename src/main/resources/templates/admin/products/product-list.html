<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quản lý sản phẩm</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body><div th:replace="~{fragments/sidebar :: sidebar}"></div><div class="app-main"><div th:replace="~{fragments/topbar :: topbar}"></div><main class="content">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4"><div><p class="eyebrow mb-1">CATALOG</p><h1 class="page-title">Sản phẩm</h1></div><a class="btn btn-primary" th:href="@{/admin/products/add}">+ Thêm sản phẩm</a></div>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <section class="panel"><form class="row g-2 mb-3" method="get" th:action="@{/admin/products}"><div class="col-md-6"><input class="form-control" name="keyword" placeholder="Tên sản phẩm..." th:value="${keyword}"></div><div class="col-md-4"><select class="form-select" name="categoryId"><option value="">Tất cả danh mục</option><option th:each="category : ${categories}" th:value="${category.cateId}" th:text="${category.cateName}" th:selected="${selectedCategoryId == category.cateId}"></option></select></div><div class="col-md-2 d-grid"><button class="btn btn-outline-primary">Lọc</button></div></form>
        <div class="table-responsive"><table class="table align-middle"><thead><tr><th>Sản phẩm</th><th>Danh mục</th><th>Giá</th><th>Tồn kho</th><th>Trạng thái</th><th></th></tr></thead><tbody>
            <tr th:each="product : ${products.content}"><td><div class="d-flex align-items-center gap-2"><img class="mini-avatar rounded-3" th:src="${product.image != null ? product.image : '/images/avatar.png'}" onerror="this.onerror=null;this.src='/images/avatar.png'" alt=""><span th:text="${product.productName}"></span></div></td><td th:text="${product.category.cateName}"></td><td th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></td><td th:text="${product.quantity}"></td><td><span class="badge" th:classappend="${product.status} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${product.status} ? 'Đang bán' : 'Đã ẩn'"></span></td><td class="text-end text-nowrap"><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/products/edit/{id}(id=${product.productId})}">Sửa</a><form th:if="${product.status}" class="d-inline" method="post" th:action="@{/admin/products/delete/{id}(id=${product.productId})}" onsubmit="return confirm('Ngừng kinh doanh sản phẩm này?')"><button class="btn btn-sm btn-outline-danger">Ẩn</button></form></td></tr>
            <tr th:if="${products.empty}"><td colspan="6" class="text-center py-4">Không có sản phẩm.</td></tr>
        </tbody></table></div>
        <nav th:if="${products.totalPages > 1}"><ul class="pagination justify-content-center"><li class="page-item" th:each="n : ${#numbers.sequence(0, products.totalPages - 1)}" th:classappend="${n == products.number} ? 'active'"><a class="page-link" th:href="@{/admin/products(page=${n},keyword=${keyword},categoryId=${selectedCategoryId})}" th:text="${n + 1}"></a></li></ul></nav>
    </section>
</main></div></body></html>
