<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sản phẩm</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body><div th:replace="~{fragments/sidebar :: sidebar}"></div><div class="app-main"><div th:replace="~{fragments/topbar :: topbar}"></div><main class="content form-content">
    <p class="eyebrow mb-1">CATALOG</p><h1 class="page-title mb-4" th:text="${isNew} ? 'Thêm sản phẩm' : 'Cập nhật sản phẩm'"></h1><div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <section class="panel"><div th:if="${#lists.isEmpty(categories)}" class="alert alert-warning">Chưa có danh mục để gắn sản phẩm. <a th:href="@{/admin/category/add}">Tạo danh mục trước</a>, sau đó quay lại thêm sản phẩm.</div><form method="post" enctype="multipart/form-data" th:action="${isNew} ? @{/admin/products/add} : @{/admin/products/edit/{id}(id=${productId})}" th:object="${form}">
        <div class="row g-3">
            <div class="col-md-8"><label class="form-label">Tên sản phẩm</label><input class="form-control" th:field="*{productName}"><div class="field-error" th:errors="*{productName}"></div></div>
            <div class="col-md-4"><label class="form-label">Danh mục</label><select class="form-select" th:field="*{categoryId}"><option value="">Chọn danh mục</option><option th:each="category : ${categories}" th:value="${category.cateId}" th:text="${category.cateName}"></option></select><div class="field-error" th:errors="*{categoryId}"></div></div>
            <div class="col-12"><label class="form-label">Mô tả</label><textarea class="form-control" rows="4" th:field="*{description}"></textarea><div class="field-error" th:errors="*{description}"></div></div>
            <div class="col-md-4"><label class="form-label">Giá bán (VND)</label><input class="form-control" type="number" step="0.01" min="0.01" th:field="*{price}"><div class="field-error" th:errors="*{price}"></div></div>
            <div class="col-md-4"><label class="form-label">Tồn kho</label><input class="form-control" type="number" min="0" th:field="*{quantity}"><div class="field-error" th:errors="*{quantity}"></div></div>
            <div class="col-md-4"><label class="form-label">Trạng thái</label><select class="form-select" th:field="*{status}"><option value="true">Đang bán</option><option value="false">Ẩn</option></select></div>
            <div class="col-12" th:if="${currentImage != null}"><label class="form-label d-block">Ảnh hiện tại</label><img class="category-preview" th:src="${currentImage}" onerror="this.onerror=null;this.src='/images/avatar.png'" alt="Ảnh sản phẩm"></div>
            <div class="col-12"><label class="form-label">Ảnh sản phẩm</label><input class="form-control" type="file" name="imageFile" accept="image/png,image/jpeg,image/gif,image/bmp"><div class="form-text">PNG, JPG, GIF, BMP tối đa 5 MB; khi sửa, không chọn ảnh mới sẽ giữ ảnh hiện tại.</div></div>
        </div><div class="mt-4"><button class="btn btn-primary" th:disabled="${#lists.isEmpty(categories)}" th:text="${isNew} ? 'Tạo sản phẩm' : 'Lưu thay đổi'"></button> <a class="btn btn-light" th:href="@{/admin/products}">Hủy</a></div>
    </form></section>
</main></div></body></html>
