<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thêm danh mục</title>
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body><div th:replace="~{fragments/sidebar :: sidebar}"></div><div class="app-main"><div th:replace="~{fragments/topbar :: topbar}"></div>
<main class="content form-content"><p class="eyebrow mb-1">CATALOG</p><h1 class="page-title mb-4">Thêm danh mục</h1>
    <section class="panel"><form method="post" th:action="@{/admin/category/add}" th:object="${category}" enctype="multipart/form-data" class="needs-validation" novalidate>
        <div class="mb-3"><label class="form-label" for="cateName">Tên danh mục</label><input id="cateName" class="form-control" th:field="*{cateName}" minlength="1" maxlength="255" required th:classappend="${#fields.hasErrors('cateName')} ? 'is-invalid'"><div class="invalid-feedback" th:errors="*{cateName}"></div></div>
        <div class="mb-4"><label class="form-label" for="imageFile">Ảnh danh mục</label><input id="imageFile" class="form-control" name="imageFile" type="file" accept="image/png,image/jpeg,image/gif,image/bmp"><div class="form-text">PNG, JPG, GIF, BMP tối đa 5 MB.</div></div>
        <button class="btn btn-primary">Lưu danh mục</button> <a class="btn btn-light" th:href="@{/admin/category/list}">Hủy</a>
    </form></section>
</main></div></body></html>
