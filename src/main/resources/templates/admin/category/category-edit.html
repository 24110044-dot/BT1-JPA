<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sửa danh mục</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body><div th:replace="~{fragments/sidebar :: sidebar}"></div><div class="app-main"><div th:replace="~{fragments/topbar :: topbar}"></div>
<main class="content form-content"><p class="eyebrow mb-1">CATALOG</p><h1 class="page-title mb-4">Sửa danh mục</h1>
    <section class="panel"><form method="post" th:action="@{/admin/category/edit/{id}(id=${category.cateId})}" th:object="${category}" enctype="multipart/form-data">
        <div class="mb-3"><label class="form-label" for="cateName">Tên danh mục</label><input id="cateName" class="form-control" th:field="*{cateName}" maxlength="255" required><div class="field-error" th:errors="*{cateName}"></div></div>
        <div class="mb-3"><label class="form-label d-block">Ảnh hiện tại</label><img class="category-preview" th:src="${category.icon != null ? category.icon : '/images/avatar.png'}" alt="Ảnh danh mục" onerror="this.onerror=null;this.src='/images/avatar.png'"></div>
        <div class="mb-4"><label class="form-label" for="imageFile">Chọn ảnh mới</label><input id="imageFile" class="form-control" name="imageFile" type="file" accept="image/png,image/jpeg,image/gif,image/bmp"><div class="form-text">Không chọn ảnh mới sẽ giữ ảnh hiện tại.</div><div class="field-error" th:errors="*{icon}"></div></div>
        <button class="btn btn-primary">Cập nhật</button> <a class="btn btn-light" th:href="@{/admin/category/list}">Quay lại</a>
    </form></section>
</main></div></body></html>
