<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý danh mục</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div class="app-main"><div th:replace="~{fragments/topbar :: topbar}"></div>
<main class="content">
    <div class="d-flex justify-content-between align-items-center gap-3 flex-wrap mb-4">
        <div><p class="eyebrow mb-1">CATALOG</p><h1 class="page-title">Danh mục</h1><p class="text-secondary mb-0" th:text="|${totalCategories} danh mục|">0 danh mục</p></div>
        <a class="btn btn-primary" th:href="@{/admin/category/add}">+ Thêm danh mục</a>
    </div>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <section class="panel">
        <form class="row g-2 mb-3" method="get" th:action="@{/admin/category/list}">
            <div class="col-sm-10"><input class="form-control" name="keyword" placeholder="Tìm tên danh mục..." th:value="${keyword}"></div>
            <div class="col-sm-2 d-grid"><button class="btn btn-outline-primary">Tìm kiếm</button></div>
        </form>
        <div class="table-responsive"><table class="table align-middle">
            <thead><tr><th>ID</th><th>Ảnh</th><th>Tên danh mục</th><th class="text-end">Thao tác</th></tr></thead>
            <tbody>
            <tr th:each="category : ${categories.content}">
                <td th:text="${category.cateId}"></td>
                <td><img class="category-thumb" th:src="${category.icon != null ? category.icon : '/images/avatar.png'}" alt="Ảnh danh mục" onerror="this.onerror=null;this.src='/images/avatar.png'"></td>
                <td class="fw-semibold" th:text="${category.cateName}"></td>
                <td class="text-end text-nowrap">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/category/edit/{id}(id=${category.cateId})}">Sửa</a>
                    <form class="d-inline" method="post" th:action="@{/admin/category/delete/{id}(id=${category.cateId})}" onsubmit="return confirm('Xác nhận xóa danh mục?')">
                        <button class="btn btn-sm btn-outline-danger">Xóa</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${categories.empty}"><td colspan="4" class="text-center text-secondary py-5">Chưa có danh mục.</td></tr>
            </tbody>
        </table></div>
        <nav th:if="${categories.totalPages > 1}"><ul class="pagination justify-content-center mb-0">
            <li class="page-item" th:classappend="${categories.first} ? 'disabled'"><a class="page-link" th:href="@{/admin/category/list(page=${categories.number - 1},keyword=${keyword})}">Trước</a></li>
            <li class="page-item" th:each="n : ${#numbers.sequence(0, categories.totalPages - 1)}" th:classappend="${n == categories.number} ? 'active'"><a class="page-link" th:href="@{/admin/category/list(page=${n},keyword=${keyword})}" th:text="${n + 1}"></a></li>
            <li class="page-item" th:classappend="${categories.last} ? 'disabled'"><a class="page-link" th:href="@{/admin/category/list(page=${categories.number + 1},keyword=${keyword})}">Sau</a></li>
        </ul></nav>
    </section>
</main></div>
<script th:src="@{/js/category.js}"></script>
</body></html>
