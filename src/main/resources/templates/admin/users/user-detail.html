<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chi tiết tài khoản</title><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body><div th:replace="~{fragments/sidebar :: sidebar}"></div><div class="app-main"><div th:replace="~{fragments/topbar :: topbar}"></div><main class="content form-content">
    <p class="eyebrow">ACCESS CONTROL</p><h1 class="page-title mb-4">Chi tiết tài khoản</h1><section class="panel">
        <div class="d-flex align-items-center gap-3 mb-4"><img class="profile-avatar" th:src="${account.avatar != null ? account.avatar : '/images/avatar.png'}" onerror="this.onerror=null;this.src='/images/avatar.png'" alt="Avatar"><div><h2 class="h4 mb-1" th:text="${account.fullName}"></h2><span class="badge text-bg-primary" th:text="${account.roleid == 1 ? 'Admin' : (account.roleid == 2 ? 'Manager' : 'User')}"></span></div></div>
        <p><strong>ID:</strong> <span th:text="${account.id}"></span></p><p><strong>Username:</strong> <span th:text="${account.userName}"></span></p><p><strong>Email:</strong> <span th:text="${account.email}"></span></p><p><strong>Điện thoại:</strong> <span th:text="${account.phone}"></span></p><p><strong>Ngày tạo:</strong> <span th:text="${account.createdDate}"></span></p>
        <a class="btn btn-primary" th:href="@{/admin/users/edit/{id}(id=${account.id})}">Sửa</a> <a class="btn btn-light" th:href="@{/admin/users}">Quay lại</a>
    </section>
</main></div></body></html>
