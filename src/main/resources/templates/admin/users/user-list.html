<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quản lý tài khoản</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body><div th:replace="~{fragments/sidebar :: sidebar}"></div><div class="app-main"><div th:replace="~{fragments/topbar :: topbar}"></div><main class="content">
    <div class="d-flex justify-content-between align-items-center gap-3 flex-wrap mb-4"><div><p class="eyebrow mb-1">ACCESS CONTROL</p><h1 class="page-title">Tài khoản</h1></div><a class="btn btn-primary" th:href="@{/admin/users/add}">+ Thêm tài khoản</a></div>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <section class="panel"><form class="row g-2 mb-3" method="get" th:action="@{/admin/users}"><div class="col-sm-10"><input class="form-control" name="keyword" placeholder="Tìm username, họ tên hoặc email..." th:value="${keyword}"></div><div class="col-sm-2 d-grid"><button class="btn btn-outline-primary">Tìm kiếm</button></div></form>
        <div class="table-responsive"><table class="table align-middle"><thead><tr><th>ID</th><th>Tài khoản</th><th>Email</th><th>Điện thoại</th><th>Vai trò</th><th></th></tr></thead><tbody>
            <tr th:each="user : ${users.content}"><td th:text="${user.id}"></td><td><div class="d-flex align-items-center gap-2"><img class="mini-avatar" th:src="${user.avatar != null ? user.avatar : '/images/avatar.png'}" onerror="this.onerror=null;this.src='/images/avatar.png'" alt=""><div><strong th:text="${user.fullName}"></strong><small class="d-block text-secondary" th:text="${user.userName}"></small></div></div></td><td th:text="${user.email}"></td><td th:text="${user.phone}"></td><td><span class="badge text-bg-light" th:text="${user.roleid == 1 ? 'Admin' : (user.roleid == 2 ? 'Manager' : 'User')}"></span></td><td class="text-end text-nowrap"><a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/users/{id}(id=${user.id})}">Chi tiết</a> <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/users/edit/{id}(id=${user.id})}">Sửa</a><form class="d-inline" method="post" th:action="@{/admin/users/delete/{id}(id=${user.id})}" onsubmit="return confirm('Xác nhận xóa tài khoản?')"><button class="btn btn-sm btn-outline-danger">Xóa</button></form></td></tr>
            <tr th:if="${users.empty}"><td colspan="6" class="text-center py-4">Không tìm thấy tài khoản.</td></tr>
        </tbody></table></div>
        <nav th:if="${users.totalPages > 1}"><ul class="pagination justify-content-center"><li class="page-item" th:each="n : ${#numbers.sequence(0, users.totalPages - 1)}" th:classappend="${n == users.number} ? 'active'"><a class="page-link" th:href="@{/admin/users(page=${n},keyword=${keyword})}" th:text="${n + 1}"></a></li></ul></nav>
    </section>
</main></div></body></html>
