<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tài khoản</title><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body><div th:replace="~{fragments/sidebar :: sidebar}"></div><div class="app-main"><div th:replace="~{fragments/topbar :: topbar}"></div><main class="content form-content">
    <p class="eyebrow mb-1">ACCESS CONTROL</p><h1 class="page-title mb-4" th:text="${isNew} ? 'Thêm tài khoản' : 'Cập nhật tài khoản'"></h1>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <section class="panel"><form method="post" th:action="${isNew} ? @{/admin/users/add} : @{/admin/users/edit/{id}(id=${userId})}" th:object="${form}" class="needs-validation" novalidate>
        <div class="row g-3">
            <div class="col-md-6"><label class="form-label" for="userName">Username</label><input id="userName" class="form-control" th:field="*{userName}" minlength="3" maxlength="50" pattern="[a-zA-Z0-9._-]+" required th:classappend="${#fields.hasErrors('userName')} ? 'is-invalid'"><div class="invalid-feedback" th:errors="*{userName}"></div></div>
            <div class="col-md-6"><label class="form-label" for="fullName">Họ tên</label><input id="fullName" class="form-control" th:field="*{fullName}" maxlength="100" required th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'"><div class="invalid-feedback" th:errors="*{fullName}"></div></div>
            <div class="col-md-6"><label class="form-label" for="email">Email</label><input id="email" class="form-control" th:field="*{email}" type="email" maxlength="254" required th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"><div class="invalid-feedback" th:errors="*{email}"></div></div>
            <div class="col-md-6"><label class="form-label" for="phone">Điện thoại</label><input id="phone" class="form-control" th:field="*{phone}" minlength="8" maxlength="20" pattern="[0-9+() .-]+" required th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'"><div class="invalid-feedback" th:errors="*{phone}"></div></div>
            <div class="col-md-6"><label class="form-label" th:text="${isNew} ? 'Mật khẩu' : 'Mật khẩu mới (để trống để giữ nguyên)'"></label><input class="form-control" th:field="*{password}" type="password" minlength="8" maxlength="72" th:required="${isNew}" autocomplete="new-password" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"><div class="invalid-feedback" th:errors="*{password}"></div></div>
            <div class="col-md-6"><label class="form-label">Avatar URL (không bắt buộc)</label><input class="form-control" th:field="*{avatar}" maxlength="255"></div>
            <div class="col-md-6"><label class="form-label">Vai trò</label><select class="form-select" th:field="*{roleid}"><option value="5">User</option><option value="2">Manager</option><option value="1">Admin</option></select></div>
        </div>
        <div class="mt-4"><button class="btn btn-primary" th:text="${isNew} ? 'Tạo tài khoản' : 'Lưu thay đổi'"></button> <a class="btn btn-light" th:href="@{/admin/users}">Hủy</a></div>
    </form></section>
</main></div></body></html>
