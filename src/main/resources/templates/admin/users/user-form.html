<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tài khoản</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body><div th:replace="~{fragments/sidebar :: sidebar}"></div><div class="app-main"><div th:replace="~{fragments/topbar :: topbar}"></div><main class="content form-content">
    <p class="eyebrow mb-1">ACCESS CONTROL</p><h1 class="page-title mb-4" th:text="${isNew} ? 'Thêm tài khoản' : 'Cập nhật tài khoản'"></h1>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <section class="panel"><form method="post" th:action="${isNew} ? @{/admin/users/add} : @{/admin/users/edit/{id}(id=${userId})}" th:object="${form}">
        <div class="row g-3">
            <div class="col-md-6"><label class="form-label">Username</label><input class="form-control" th:field="*{userName}"><div class="field-error" th:errors="*{userName}"></div></div>
            <div class="col-md-6"><label class="form-label">Họ tên</label><input class="form-control" th:field="*{fullName}"><div class="field-error" th:errors="*{fullName}"></div></div>
            <div class="col-md-6"><label class="form-label">Email</label><input class="form-control" th:field="*{email}" type="email"><div class="field-error" th:errors="*{email}"></div></div>
            <div class="col-md-6"><label class="form-label">Điện thoại</label><input class="form-control" th:field="*{phone}"><div class="field-error" th:errors="*{phone}"></div></div>
            <div class="col-md-6"><label class="form-label" th:text="${isNew} ? 'Mật khẩu' : 'Mật khẩu mới (để trống để giữ nguyên)'"></label><input class="form-control" th:field="*{password}" type="password" autocomplete="new-password"><div class="field-error" th:errors="*{password}"></div></div>
            <div class="col-md-6"><label class="form-label">Avatar URL (không bắt buộc)</label><input class="form-control" th:field="*{avatar}" maxlength="255"></div>
            <div class="col-md-6"><label class="form-label">Vai trò</label><select class="form-select" th:field="*{roleid}"><option value="5">User</option><option value="2">Manager</option><option value="1">Admin</option></select></div>
        </div>
        <div class="mt-4"><button class="btn btn-primary" th:text="${isNew} ? 'Tạo tài khoản' : 'Lưu thay đổi'"></button> <a class="btn btn-light" th:href="@{/admin/users}">Hủy</a></div>
    </form></section>
</main></div></body></html>
