<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin Dashboard</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body><div th:replace="~{fragments/sidebar :: sidebar}"></div><div class="app-main"><div th:replace="~{fragments/topbar :: topbar}"></div><main class="content">
    <p class="eyebrow mb-1">OVERVIEW</p><h1 class="page-title mb-4">Admin Dashboard</h1>
    <div class="row g-3"><div class="col-md-4"><section class="stat-card"><span class="stat-icon">▤</span><div class="text-secondary">Tổng danh mục</div><div class="stat-number" th:text="${totalCategories}">0</div><a th:href="@{/admin/category/list}">Quản lý danh mục →</a></section></div><div class="col-md-4"><section class="stat-card"><span class="stat-icon">▣</span><div class="text-secondary">Sản phẩm đang bán</div><div class="stat-number" th:text="${totalProducts}">0</div><a th:href="@{/admin/products}">Quản lý sản phẩm →</a></section></div><div class="col-md-4"><section class="stat-card"><span class="stat-icon">♙</span><div class="text-secondary">Tổng tài khoản</div><div class="stat-number" th:text="${totalUsers}">0</div><a th:href="@{/admin/users}">Quản lý tài khoản →</a></section></div><div class="col-md-4"><section class="stat-card"><span class="stat-icon">▧</span><div class="text-secondary">Đơn hàng</div><a class="btn btn-outline-primary mt-2" th:href="@{/admin/orders}">Quản lý đơn hàng →</a></section></div></div>
</main></div></body></html>
