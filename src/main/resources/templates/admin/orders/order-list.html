<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quản lý đơn hàng</title><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body><div th:replace="~{fragments/sidebar :: sidebar}"></div><div class="app-main"><div th:replace="~{fragments/topbar :: topbar}"></div><main class="content">
    <p class="eyebrow mb-1">FULFILLMENT</p><h1 class="page-title mb-4">Quản lý đơn hàng</h1><div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <section class="panel"><form class="row g-2 mb-3" method="get" th:action="@{/admin/orders}"><div class="col-md-6"><input class="form-control" name="keyword" placeholder="Mã đơn hàng..." th:value="${keyword}"></div><div class="col-md-4"><select class="form-select" name="status"><option value="">Tất cả trạng thái</option><option th:each="state : ${statuses}" th:value="${state}" th:text="${state}" th:selected="${selectedStatus == state}"></option></select></div><div class="col-md-2 d-grid"><button class="btn btn-outline-primary">Lọc</button></div></form>
        <div class="table-responsive"><table class="table align-middle"><thead><tr><th>Mã</th><th>Khách hàng</th><th>Ngày đặt</th><th>Tổng</th><th>Thanh toán</th><th>Trạng thái</th><th></th></tr></thead><tbody>
            <tr th:each="order : ${orders.content}"><td th:text="|#${order.orderId}|"></td><td th:text="${order.recipientName}"></td><td th:text="${#temporals.format(order.orderDate, 'dd/MM/yyyy HH:mm')}"></td><td th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></td><td th:text="${order.paymentMethod}"></td><td><span class="badge text-bg-light" th:text="${order.orderStatus}"></span></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/orders/{id}(id=${order.orderId})}">Chi tiết</a></td></tr>
            <tr th:if="${orders.empty}"><td colspan="7" class="text-center py-4">Chưa có đơn hàng.</td></tr>
        </tbody></table></div>
        <nav th:if="${orders.totalPages > 1}"><ul class="pagination justify-content-center"><li class="page-item" th:each="n : ${#numbers.sequence(0, orders.totalPages - 1)}" th:classappend="${n == orders.number} ? 'active'"><a class="page-link" th:href="@{/admin/orders(page=${n},keyword=${keyword},status=${selectedStatus})}" th:text="${n + 1}"></a></li></ul></nav>
    </section>
</main></div></body></html>
