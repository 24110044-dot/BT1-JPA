<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chi tiết đơn hàng</title><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body><div th:replace="~{fragments/sidebar :: sidebar}"></div><div class="app-main"><div th:replace="~{fragments/topbar :: topbar}"></div><main class="content">
    <p class="eyebrow mb-1">FULFILLMENT</p><h1 class="page-title mb-4" th:text="|Đơn hàng #${order.orderId}|"></h1><div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <div class="row g-4"><div class="col-lg-8"><section class="panel p-0 overflow-hidden"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Sản phẩm</th><th>Giá</th><th>SL</th><th>Tạm tính</th></tr></thead><tbody><tr th:each="item : ${order.items}"><td><div class="d-flex align-items-center gap-2"><img class="cart-product-image" th:src="${item.productImage != null ? item.productImage : '/images/avatar.png'}" onerror="this.onerror=null;this.src='/images/avatar.png'" alt=""><span th:text="${item.productName}"></span></div></td><td th:text="${#numbers.formatDecimal(item.unitPrice, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></td><td th:text="${item.quantity}"></td><td th:text="${#numbers.formatDecimal(item.subtotal, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></td></tr></tbody></table></div></section></div>
        <div class="col-lg-4"><section class="panel"><h2 class="h5">Giao hàng</h2><p th:text="${order.recipientName}"></p><p th:text="${order.phone}"></p><p th:text="${order.shippingAddress}"></p><p><strong>Người đặt:</strong> <span th:text="${order.user.userName}"></span></p><p><strong>Thanh toán:</strong> <span th:text="${order.paymentMethod}"></span> / <span th:text="${order.paymentStatus}"></span></p><p><strong>Tổng:</strong> <span class="product-price" th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></span></p>
            <form method="post" th:action="@{/admin/orders/{id}/status(id=${order.orderId})}"><label class="form-label">Cập nhật trạng thái</label><select class="form-select mb-2" name="status" th:disabled="${order.orderStatus == 'COMPLETED' or order.orderStatus == 'CANCELLED'}"><option th:each="state : ${statuses}" th:value="${state}" th:text="${state}" th:selected="${state == order.orderStatus}"></option></select><button class="btn btn-primary w-100" th:disabled="${order.orderStatus == 'COMPLETED' or order.orderStatus == 'CANCELLED'}">Cập nhật</button></form>
        </section></div></div><a class="btn btn-light mt-3" th:href="@{/admin/orders}">Quay lại danh sách</a>
</main></div></body></html>
