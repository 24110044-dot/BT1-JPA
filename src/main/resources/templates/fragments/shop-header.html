<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header" class="shop-header">
    <nav class="navbar navbar-expand-lg container">
        <a class="brand" th:href="@{/shop}"><span class="brand-mark">C</span><span>Category<span class="brand-light">Hub</span></span></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#shopNav"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="shopNav">
            <div class="navbar-nav me-auto ms-lg-4">
                <a class="nav-link" th:href="@{/shop}">Trang chủ</a>
                <a class="nav-link" th:href="@{/products}">Sản phẩm</a>
                <a class="nav-link" th:href="@{/videos}">Video</a>
                <a class="nav-link" th:if="${currentUser != null and !isAdmin and !isManager}"
                   th:href="@{/video}">Video của tôi</a>
                <div class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">Danh mục</a>
                    <ul class="dropdown-menu">
                        <li th:each="category : ${categories}"><a class="dropdown-item" th:href="@{/products/category/{id}(id=${category.cateId})}" th:text="${category.cateName}"></a></li>
                        <li th:if="${categories == null or #lists.isEmpty(categories)}"><a class="dropdown-item" th:href="@{/products}">Tất cả sản phẩm</a></li>
                    </ul>
                </div>
                <a class="nav-link" th:if="${currentUser != null and !isAdmin and !isManager}" th:href="@{/member/orders}">Đơn hàng</a>
                <a class="nav-link" th:if="${currentUser != null and !isAdmin and !isManager}" th:href="@{/member/myaccount}">Tài khoản</a>
            </div>
            <form class="d-flex shop-search me-lg-3" method="get" th:action="@{/products}">
                <input class="form-control form-control-sm" name="keyword" placeholder="Tìm sản phẩm..." aria-label="Tìm sản phẩm">
                <button class="btn btn-sm btn-primary" type="submit">Tìm</button>
            </form>
            <div th:if="${currentUser != null and !isAdmin and !isManager}" class="d-flex align-items-center gap-2 mt-3 mt-lg-0">
                <a class="btn btn-light position-relative" th:href="@{/cart}" aria-label="Giỏ hàng">🛒
                    <span class="cart-badge" th:text="${cartCount}">0</span>
                </a>
                <a class="user-chip" th:href="@{/member/myaccount}"><img th:src="${currentUser.avatar != null ? currentUser.avatar : '/images/avatar.png'}" onerror="this.onerror=null;this.src='/images/avatar.png'" alt=""><span th:text="${currentUser.fullName}"></span></a>
                <form method="post" th:action="@{/logout}"><button class="btn btn-outline-secondary btn-sm">Thoát</button></form>
            </div>
            <div th:if="${currentUser == null}" class="d-flex gap-2 mt-3 mt-lg-0">
                <a class="btn btn-outline-primary btn-sm" th:href="@{/login}">Đăng nhập</a>
                <a class="btn btn-primary btn-sm" th:href="@{/register}">Đăng ký</a>
            </div>
            <div th:if="${currentUser != null and (isAdmin or isManager)}" class="d-flex align-items-center gap-2 mt-3 mt-lg-0">
                <a class="btn btn-outline-primary btn-sm" th:href="${isAdmin} ? @{/admin/home} : @{/manager/home}">Khu vực quản trị</a>
                <form method="post" th:action="@{/logout}"><button class="btn btn-outline-secondary btn-sm">Thoát</button></form>
            </div>
        </div>
    </nav>
</header>


</body>
</html>
