<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hồ sơ cá nhân | CategoryHub</title>
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="shop-page">
<div th:replace="~{fragments/shop-header :: header}"></div>
<main class="container shop-content profile-page">
    <div class="section-heading mb-4">
        <div><p class="eyebrow mb-1">TÀI KHOẢN</p><h1>Quản lý hồ sơ</h1></div>
        <a th:href="@{/member/orders}" th:if="${!isAdmin and !isManager}">Xem đơn hàng →</a>
        <a th:href="${isAdmin} ? @{/admin/home} : @{/manager/home}" th:if="${isAdmin or isManager}">Về khu vực quản trị →</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="row g-4">
        <div class="col-lg-4">
            <section class="panel profile-summary h-100">
                <div class="text-center">
                    <img class="profile-avatar mb-3"
                         th:src="${profile.avatar != null ? profile.avatar : '/images/avatar.png'}"
                         onerror="this.onerror=null;this.src='/images/avatar.png'" alt="Ảnh đại diện">
                    <h2 class="h4 fw-bold mb-1" th:text="${profile.fullName}"></h2>
                    <span class="badge rounded-pill text-bg-primary"
                          th:text="${isAdmin ? 'ADMIN' : (isManager ? 'MANAGER' : 'USER')}"></span>
                </div>
                <div class="profile-detail"><span>Tên đăng nhập</span><strong th:text="${profile.userName}"></strong></div>
                <div class="profile-detail"><span>Email hiện tại</span><strong th:text="${profile.email}"></strong></div>
                <div class="profile-detail"><span>Số điện thoại</span><strong th:text="${profile.phone}"></strong></div>

                <form class="mt-4" th:action="@{/profile/avatar}" method="post" enctype="multipart/form-data">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <label class="form-label" for="avatar">Ảnh đại diện JPEG, PNG hoặc WEBP</label>
                    <input id="avatar" class="form-control" type="file" name="avatar"
                           accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" required>
                    <button class="btn btn-primary w-100 mt-3 avatar-submit" type="submit">
                        <span class="submit-text">Thay đổi ảnh</span>
                    </button>
                </form>
            </section>
        </div>

        <div class="col-lg-8">
            <section class="panel mb-4">
                <h2 class="h5 fw-bold mb-3">Thông tin cá nhân</h2>
                <form th:action="@{/profile/update}" th:object="${updateForm}" method="post" class="needs-validation" novalidate>
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="mb-3">
                        <label class="form-label" for="fullName">Họ và tên</label>
                        <input id="fullName" class="form-control" th:field="*{fullName}" required minlength="2" maxlength="100"
                               th:classappend="${#fields.hasErrors('fullName')} ? ' is-invalid'">
                        <div class="invalid-feedback" th:errors="*{fullName}"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="phone">Số điện thoại</label>
                        <input id="phone" class="form-control" th:field="*{phone}" required minlength="8" maxlength="20"
                               pattern="(?=(?:.*[0-9]){8,})[0-9+() .-]{8,20}" placeholder="Ví dụ: 0901234567"
                               th:classappend="${#fields.hasErrors('phone')} ? ' is-invalid'">
                        <div class="invalid-feedback" th:errors="*{phone}"></div>
                    </div>
                    <button class="btn btn-primary" type="submit">Lưu thông tin</button>
                </form>
            </section>

            <section class="panel">
                <h2 class="h5 fw-bold mb-3">Thay đổi email bằng OTP</h2>
                <form th:action="@{/profile/email/send-otp}" th:object="${emailForm}" method="post" class="needs-validation" novalidate>
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <label class="form-label" for="newEmail">Email mới</label>
                    <div class="input-group">
                        <input id="newEmail" class="form-control" type="email" name="email"
                               th:value="${pendingEmail != null ? pendingEmail : emailForm.email}" maxlength="254" required
                               th:classappend="${#fields.hasErrors('email')} ? ' is-invalid'"
                               placeholder="name@example.com">
                        <button class="btn btn-outline-primary otp-send" type="submit">
                            <span class="submit-text">Gửi OTP</span>
                        </button>
                    </div>
                    <div class="invalid-feedback d-block" th:errors="*{email}"></div>
                </form>

                <form th:action="@{/profile/email/verify-otp}" th:object="${otpForm}" method="post"
                      class="mt-4 needs-validation" novalidate th:if="${pendingEmail}" data-otp-form>
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="alert alert-info mb-3" role="status">
                        <strong>Kiểm tra hộp thư đến</strong>
                        <div>Mã xác minh đã được gửi đến <strong th:text="${pendingEmail}"></strong>.</div>
                        <small>Mã có hiệu lực trong 5 phút và chỉ sử dụng được một lần.</small>
                    </div>
                    <fieldset class="otp-fieldset mb-4">
                        <legend class="form-label">Nhập mã gồm 6 chữ số</legend>
                        <div class="otp-inputs" role="group" aria-label="Nhập mã OTP gồm 6 chữ số" hidden>
                            <input class="otp-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1"
                                   autocomplete="one-time-code" aria-label="Chữ số thứ nhất" data-otp-digit disabled>
                            <input class="otp-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1"
                                   aria-label="Chữ số thứ hai" data-otp-digit disabled>
                            <input class="otp-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1"
                                   aria-label="Chữ số thứ ba" data-otp-digit disabled>
                            <input class="otp-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1"
                                   aria-label="Chữ số thứ tư" data-otp-digit disabled>
                            <input class="otp-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1"
                                   aria-label="Chữ số thứ năm" data-otp-digit disabled>
                            <input class="otp-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1"
                                   aria-label="Chữ số thứ sáu" data-otp-digit disabled>
                        </div>
                        <input class="form-control otp-code-fallback" type="text" th:field="*{code}"
                               inputmode="numeric" pattern="[0-9]{6}" maxlength="6" minlength="6"
                               autocomplete="one-time-code" placeholder="Nhập mã 6 chữ số"
                               aria-label="Mã xác minh gồm 6 chữ số" required
                               th:classappend="${#fields.hasErrors('code')} ? 'is-invalid'" data-otp-fallback>
                        <div class="invalid-feedback" th:errors="*{code}"></div>
                        <input type="hidden" data-otp-value>
                    </fieldset>
                    <button class="btn btn-primary w-100" type="submit">Xác nhận email mới</button>
                </form>
                <form th:action="@{/profile/email/send-otp}" method="post" class="otp-resend mt-3"
                      th:if="${pendingEmail}" data-resend-form>
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="email" th:value="${pendingEmail}">
                    <span class="text-secondary">Chưa nhận được mã?</span>
                    <button class="btn btn-link p-0 align-baseline" type="submit" data-resend-button>Gửi lại mã</button>
                    <span class="otp-countdown text-secondary" data-resend-countdown aria-live="polite"></span>
                </form>
            </section>
        </div>
    </div>
</main>
<div th:replace="~{fragments/shop-footer :: footer}"></div>
<script th:src="@{/js/otp-input.js}" defer></script>
<script>
document.querySelectorAll('form.needs-validation').forEach(function (form) {
    form.addEventListener('submit', function (event) {
        if (!form.checkValidity()) {
            event.preventDefault();
            event.stopPropagation();
        } else {
            var button = form.querySelector('button[type="submit"]');
            if (button) {
                button.disabled = true;
                var text = button.querySelector('.submit-text');
                if (text) text.textContent = 'Đang xử lý...';
            }
        }
        form.classList.add('was-validated');
    });
});
</script>
</body>
</html>
